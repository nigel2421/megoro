  <circle cx="256" cy="96" r="28" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="395" cy="176" r="24" fill="#3b82f6" stroke="#ffffff" stroke-width="4"/>
  <circle cx="395" cy="336" r="24" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="416" r="24" fill="#8b5cf6" stroke="#ffffff" stroke-width="4"/>
  <circle cx="117" cy="336" r="24" fill="#ec4899" stroke="#ffffff" stroke-width="4"/>
  <circle cx="117" cy="176" r="24" fill="#06b6d4" stroke="#ffffff" stroke-width="4"/>
  <!-- Central Mezani Vault Shield -->
