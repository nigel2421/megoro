      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#grad)"/>
  <!-- Circular Merry-go-round Track -->
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="12" fill="none" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="160" stroke="url(#gold)" stroke-width="12" fill="none" stroke-dasharray="140 80" stroke-linecap="round"/>
